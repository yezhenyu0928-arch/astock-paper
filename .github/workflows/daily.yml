name: daily
on:
  schedule:
    - cron: '40 9 * * 1-5'    # UTC09:40 = 北京17:40 主触发
    - cron: '10 10 * * 1-5'   # 北京18:10 补跑(run_daily 幂等,重复安全)
  workflow_dispatch:
    inputs:
      force_rebalance:
        description: '强制调仓日(绕过月频,用于验证选股/修复是否生效)'
        type: boolean
        default: false
      no_push:
        description: '不推送微信(仅验证日志,默认false)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      # DB 用 cache 持久化(避免把大二进制提交进 git 造成仓库膨胀)。
      # key 每次唯一以强制保存新版,restore-keys 前缀取回最近一次。
      - name: restore DB cache
        uses: actions/cache@v4
        with:
          path: db/market.sqlite
          key: db-${{ github.run_id }}
          restore-keys: db-
      # 2026-07-27: 海外 Runner 抓不到 baostock 历史基本面 → 个股策略选股全空。
      # 基本面覆盖不足时从 db-seed 分支整库还原(与 backtest.yml prep 同一机制)。
      - name: checkout db-seed branch
        uses: actions/checkout@v4
        with:
          ref: db-seed
          path: seed
      - name: restore DB from seed (基本面覆盖不足则整库还原)
        run: |
          NEED=$(python - <<'PY'
          import sqlite3, os
          need = 1
          if os.path.exists("db/market.sqlite"):
              try:
                  c = sqlite3.connect("db/market.sqlite")
                  fund = c.execute("SELECT COUNT(DISTINCT code) FROM fundamental").fetchone()[0]
                  mb = c.execute("SELECT COUNT(*) FROM index_members WHERE index_code='mainboard'").fetchone()[0]
                  try:
                      pq = c.execute("SELECT COUNT(*) FROM profit_q").fetchone()[0]
                  except Exception:
                      pq = 0
                  # 2026-07-28: 新增 profit_q 覆盖度校验——云端必须拥有 SUE 因子数据(profit_q 来自本地 baostock 抓取后入种子库,
                  # 海外 Runner 连不上 baostock, 故只能靠 db-seed 种子库还原。旧缓存库无 profit_q 时强制整库还原, 确保云拥有数据。
                  if fund >= 600 and mb >= 800 and pq >= 1000:
                      need = 0
                  c.close()
              except Exception:
                  pass
          print(need)
          PY
          )
          if [ "$NEED" = "1" ]; then
            echo "云端库基本面覆盖不足,从 db-seed 分支还原完整种子库..."
            mkdir -p db
            cat seed/db_seed.sqlite.gz.part* | gunzip > db/market.sqlite
          else
            echo "库基本面覆盖充分,跳过种子还原"
          fi
          rm -rf seed
      - name: run pipeline
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          AGNES_LLM_KEY: ${{ secrets.AGNES_LLM_KEY }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          FORCE_REBALANCE: ${{ github.event.inputs.force_rebalance }}
          NO_PUSH: ${{ github.event.inputs.no_push }}
        run: python run_daily.py
      - name: bundle Chart.js locally (no CDN dependency)
        # CI 有外网:把 Chart.js 抓到 docs/vendor/,使 Pages 自带该文件,不再依赖用户浏览器访问境外 CDN。
        run: |
          mkdir -p docs/vendor
          for url in \
            "https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" \
            "https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.7/chart.umd.min.js" \
            "https://unpkg.com/chart.js@4.4.7/dist/chart.umd.min.js" ; do
            if curl -fsSL --max-time 30 -o docs/vendor/chart.umd.min.js "$url"; then
              echo "Chart.js fetched from $url"; break
            fi
          done
          if [ -s docs/vendor/chart.umd.min.js ]; then
            echo "vendor size: $(wc -c < docs/vendor/chart.umd.min.js) bytes"
          else
            echo "::warning::Chart.js 下载失败,看板图表将回退为空白(页面其余正常)"
          fi
      - name: alert on failure
        if: failure()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
        run: python notify.py --alert "🔴 今日Actions任务失败,系统未正常运行,请暂停跟单并检查" || true
      # 只提交文本快照(state/reports/docs),不提交 DB。docs/ 供 GitHub Pages。
      # 卡B:push 失败不再静默吞错——最多重试3次(每次先 rebase),仍失败则告警(Pages 会停更)。
      - name: commit snapshot
        run: |
          git config user.name "astock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ reports/ docs/ || true
          git commit -m "snapshot $(date -u +%F)" || { echo "nothing to commit"; exit 0; }
          pushed=0
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then pushed=1; break; fi
            echo "push 第 $i 次失败,重试..."; sleep 5
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::snapshot push 三次均失败"
            python notify.py --alert "🔴 看板快照推送失败(git push 三次均失败),GitHub Pages 未更新,请检查仓库权限/冲突" || true
            exit 1
          fi
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
